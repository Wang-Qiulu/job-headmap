[package]
name = "job_headmap"
version = "2.2.0"
description = "投递工具 — 本地优先的秋招投递记录"
authors = ["Job Dashboard Dev"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "job_headmap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"

# Optimise release builds for binary size — the user-facing artifact is a DMG;
# shaving MBs matters more than peak CPU speed for this app.
[profile.release]
opt-level = "z"   # size-optimised
lto = true        # whole-program link-time optimisation
codegen-units = 1 # better optimisation, slower compile
strip = true      # remove debug symbols
panic = "abort"   # no unwinding tables
