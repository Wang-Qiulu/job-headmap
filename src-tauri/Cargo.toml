[package]
name = "job_headmap"
version = "0.1.0"
description = "Job Headmap desktop"
authors = ["Job Dashboard Dev"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "job_headmap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"
